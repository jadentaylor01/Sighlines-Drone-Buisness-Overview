<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Sightline Drone Solutions centered icon</title>
  <desc id="desc">A centered connected-rotor drone flying in front of a warm sun over a green horizon and blue sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#72BDEA"/>
      <stop offset="1" stop-color="#EAF8FD"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#sky)"/>
  <circle cx="674" cy="498" r="202" fill="#F9D86C"/>
  <path d="M0 623C120 588 258 601 376 632 502 665 633 605 747 615 854 624 927 608 1000 586V1000H0Z" fill="#4D945D"/>
  <path d="M0 739C126 704 243 756 370 730 526 698 618 748 747 720 852 697 935 723 1000 712V1000H0Z" fill="#3E7C4D" opacity=".8"/>
  <path d="M0 623C120 588 258 601 376 632 502 665 633 605 747 615 854 624 927 608 1000 586" fill="none" stroke="#2D6B43" stroke-width="8"/>

