    <circle cx="300" cy="250" r="37" fill="#F7B733" stroke="none"/>
    <circle cx="300" cy="250" r="11" fill="#0A233C" stroke="none"/>
    <path d="M260 345H340" stroke-width="13"/>
  </g>
</svg>
