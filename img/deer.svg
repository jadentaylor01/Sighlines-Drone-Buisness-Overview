<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title">
  <title id="title">Standing buck deer silhouette</title>
  <g fill="#4a7c4e">
    <!-- antlers, fanned tines from forehead -->
    <polygon points="80,100 55,32 63,30 87,94"/>
    <polygon points="85,97 45,52 52,48 95,90"/>
    <polygon points="90,94 50,77 55,70 100,87"/>
    <polygon points="95,90 125,22 133,24 103,84"/>

    <!-- ear -->
    <polygon points="108,108 122,75 98,100"/>

    <!-- neck, head, nose -->
    <polygon points="180,195 145,155 105,115 78,105 50,118 40,138 52,155 95,170 155,208"/>

    <!-- body -->
    <ellipse cx="240" cy="225" rx="95" ry="55"/>

    <!-- tail -->
    <polygon points="330,210 350,195 345,215"/>

    <!-- legs -->
    <rect x="150" y="260" width="16" height="140"/>
    <rect x="185" y="255" width="16" height="148"/>
    <rect x="275" y="255" width="17" height="150"/>
    <rect x="310" y="260" width="17" height="145"/>

    <!-- hooves -->
    <rect x="147" y="396" width="22" height="14"/>
    <rect x="182" y="399" width="22" height="14"/>
    <rect x="272" y="401" width="23" height="14"/>
    <rect x="307" y="401" width="23" height="14"/>
  </g>
</svg>
